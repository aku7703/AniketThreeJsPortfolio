<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>Blog | Aniket Chaudhry</title>
  <meta name="description" content="Aniket Chaudhry's notes on software engineering, space systems, and technology.">
  <link rel="canonical" href="https://aniketc.tech/blog">
  <meta property="og:title" content="Blog | Aniket Chaudhry">
  <meta property="og:description" content="Notes on software engineering, space systems, and technology.">
  <meta property="og:url" content="https://aniketc.tech/blog">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="blog.css">
</head>

<body>
  <!-- Navigation -->
  <nav id="blog-nav">
    <div class="nav-container">
      <a class="nav-logo" href="/">Aniket Chaudhry</a>
      <button class="mobile-menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="blog-navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="blog-navigation">
        <li><a href="/#about">About</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/blog" class="active">Blog</a></li>
        <li><a href="/Resume-AniketChaudhry.pdf" class="nav-cta" target="_blank" rel="noopener">Resume</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Banner -->
  <header class="blog-hero">
    <div class="hero-content">
      <h1>Blog</h1>
      <p>Thoughts on technology, space exploration, and software engineering</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="blog-main">
    <!-- Post List View -->
    <div id="posts-list" class="posts-container">
      <div class="posts-grid">
        <!-- Posts will be loaded dynamically -->
      </div>
    </div>

    <!-- Single Post View -->
    <article id="post-view" class="article-container" style="display: none;">
      <button class="back-btn" onclick="hidePost()">
        <i class="fas fa-arrow-left"></i> All Posts
      </button>
      <div class="article-header">
        <img id="post-cover" class="article-cover" src="" alt="" style="display: none;">
        <time id="post-date" class="article-date"></time>
        <h1 id="post-title" class="article-title"></h1>
      </div>
      <div id="post-content" class="article-body">
        <!-- Content loaded dynamically -->
      </div>
      <footer class="article-footer">
        <button class="back-btn" onclick="hidePost()">
          <i class="fas fa-arrow-left"></i> Back to all posts
        </button>
      </footer>
    </article>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-content">
      <p>&copy; 2026 Aniket Chaudhry</p>
      <div class="footer-links">
        <a href="https://linkedin.com/in/aniketchaudhry" target="_blank" rel="noopener" aria-label="Aniket Chaudhry on LinkedIn"><i class="fab fa-linkedin" aria-hidden="true"></i></a>
        <a href="https://github.com/aku7703" target="_blank" rel="noopener" aria-label="Aniket Chaudhry on GitHub"><i class="fab fa-github" aria-hidden="true"></i></a>
      </div>
    </div>
  </footer>

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    // Blog posts data (will be loaded from markdown files)
    // For static hosting, we use a manifest approach
    const postsManifest = [
      {
        slug: 'creating-portfolio-website',
        title: 'Creating My Portfolio Website!',
        date: '2024-06-19',
        excerpt: 'Learn about my journey of creating my portfolio website using new tools like Three.js and Particle.js.',
        cover: ''
      },
      {
        slug: 'university-nanosatellite-program',
        title: 'University Nanosatellite Program Kick-Off!',
        date: '2024-05-20',
        excerpt: 'I represented Northeastern University at NASA\'s Kennedy Space Center for the University Nanosatellite Program.',
        cover: ''
      }
    ];

    let currentPosts = [];

    // Format date
    function formatDate(dateString) {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString('en-US', options);
    }

    // Calculate read time
    function getReadTime(content) {
      const words = content.split(/\s+/).length;
      const minutes = Math.ceil(words / 200);
      return `${minutes} min read`;
    }

    // Render posts list
    function renderPostsList() {
      const grid = document.querySelector('.posts-grid');

      // Sort by date descending
      const sorted = [...postsManifest].sort((a, b) => new Date(b.date) - new Date(a.date));

      grid.innerHTML = sorted.map((post, index) => `
        <a class="post-card ${index === 0 ? 'featured' : ''}" href="/blog?post=${post.slug}" data-post-slug="${post.slug}">
          ${post.cover ? `<img src="${post.cover}" alt="${post.title}" class="post-cover">` : ''}
          <div class="post-content">
            <time class="post-meta">${formatDate(post.date)}</time>
            <h2 class="post-title">${post.title}</h2>
            <p class="post-excerpt">${post.excerpt}</p>
            <span class="read-more">Read article <i class="fas fa-arrow-right"></i></span>
          </div>
        </a>
      `).join('');

      grid.querySelectorAll('[data-post-slug]').forEach(card => {
        card.addEventListener('click', (event) => {
          event.preventDefault();
          showPost(card.dataset.postSlug);
        });
      });
    }

    // Show single post
    async function showPost(slug) {
      try {
        // Fetch the markdown file
        const response = await fetch(`/content/blog/${slug}.md`);
        const text = await response.text();

        // Parse frontmatter and content
        const parts = text.split('---');
        const frontmatter = parts[1];
        const content = parts.slice(2).join('---');

        // Extract metadata
        const meta = {};
        frontmatter.split('\n').forEach(line => {
          const [key, ...value] = line.split(':');
          if (key && value.length) {
            meta[key.trim()] = value.join(':').trim().replace(/^["']|["']$/g, '');
          }
        });

        // Render
        document.getElementById('post-title').textContent = meta.title || '';
        document.getElementById('post-date').textContent = formatDate(meta.date);

        const coverImg = document.getElementById('post-cover');
        if (meta.cover) {
          coverImg.src = meta.cover;
          coverImg.style.display = 'block';
        } else {
          coverImg.style.display = 'none';
        }

        // Render markdown content
        document.getElementById('post-content').innerHTML = marked.parse(content);

        // Switch views
        document.getElementById('posts-list').style.display = 'none';
        document.getElementById('post-view').style.display = 'block';

        history.replaceState({}, '', `/blog?post=${encodeURIComponent(slug)}`);

        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        console.error('Error loading post:', error);
      }
    }

    // Hide post
    function hidePost() {
      document.getElementById('post-view').style.display = 'none';
      document.getElementById('posts-list').style.display = 'block';
      history.replaceState({}, '', '/blog');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Mobile menu toggle
    const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
    const navLinks = document.querySelector('.nav-links');
    const blogNav = document.getElementById('blog-nav');
    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        const isOpen = !mobileMenuBtn.classList.contains('active');
        mobileMenuBtn.classList.toggle('active', isOpen);
        navLinks.classList.toggle('active', isOpen);
        blogNav.classList.toggle('menu-open', isOpen);
        mobileMenuBtn.setAttribute('aria-expanded', String(isOpen));
        mobileMenuBtn.setAttribute('aria-label', isOpen ? 'Close navigation' : 'Open navigation');
      });
    }
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenuBtn?.classList.remove('active');
        navLinks?.classList.remove('active');
        blogNav?.classList.remove('menu-open');
        mobileMenuBtn?.setAttribute('aria-expanded', 'false');
        mobileMenuBtn?.setAttribute('aria-label', 'Open navigation');
      });
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        mobileMenuBtn?.classList.remove('active');
        navLinks?.classList.remove('active');
        blogNav?.classList.remove('menu-open');
        mobileMenuBtn?.setAttribute('aria-expanded', 'false');
        mobileMenuBtn?.setAttribute('aria-label', 'Open navigation');
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderPostsList();
      const requestedPost = new URLSearchParams(window.location.search).get('post');
      if (requestedPost && postsManifest.some(post => post.slug === requestedPost)) showPost(requestedPost);
    });
  </script>
</body>

</html>
